name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Prebuilt Anchor/AVM binaries require GLIBC_2.39 (Ubuntu 24.04).
  # Do not downgrade these jobs to ubuntu-22.04.
  SOLANA_VERSION: v3.1.10
  ANCHOR_VERSION: 1.1.2

jobs:
  rust:
    name: Rust (build, test, clippy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace
        run: cargo build --workspace --locked
      - name: Test (golden vectors + LiteSVM program tests)
        # The LiteSVM program tests skip here because no SBF artifact exists
        # until `anchor build`; the `anchor` job runs them against the built
        # program below.
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -W clippy::all -W clippy::pedantic
      - name: Format check
        run: cargo fmt --all -- --check

  anchor:
    name: Anchor (build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
      - uses: Swatinem/rust-cache@v2
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install Anchor CLI
        run: |
          curl -sSfL "https://github.com/otter-sec/anchor/releases/download/v${ANCHOR_VERSION}/anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu" -o /tmp/anchor
          chmod +x /tmp/anchor
          sudo mv /tmp/anchor /usr/local/bin/anchor
      - name: Create local wallet
        run: solana-keygen new --no-bip39-passphrase --force -o "$HOME/.config/solana/id.json"
      - name: Tool versions
        run: |
          solana --version
          anchor --version
      - name: Anchor build
        run: anchor build
      - name: Test (LiteSVM program tests against built artifact)
        # `anchor build` produced target/deploy/forge_repository.so, so the
        # Phase 3 LiteSVM tests execute here rather than skipping.
        run: cargo test --workspace --locked
