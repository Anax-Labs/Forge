[package]
name = "forge"
version = "0.1.0"
description = "Forge CLI — Git-backed onchain version control client"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
forge-object = { path = "../crates/forge-object" }
