[package]
name = "forge_repository"
version = "0.1.0"
description = "Forge onchain version-control protocol program"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "forge_repository"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { workspace = true, features = ["event-cpi"] }
# Canonical object/hashing/history engine. The program imports the genesis
# history-root function rather than re-implementing it (§5, §5.6).
forge-object = { path = "../../crates/forge-object" }
solana-instructions-sysvar = "3.0.1"

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
